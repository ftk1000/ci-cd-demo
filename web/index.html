<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator — built by CI/CD</title>
<style>
  :root {
    --ink: #1a2733;
    --muted: #6b7b8a;
    --line: #d7dee5;
    --accent: #0b3d62;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: #f4f7fa;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 1px 3px rgba(16,40,64,.06);
  }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid #9dc3e0; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 16px; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #a8b6c2; cursor: not-allowed; }
  button:not(:disabled):hover { background: #124b76; }
  .result {
    margin-top: 20px;
    padding: 16px;
    background: #f0f6fb;
    border: 1px solid #c8d8e4;
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    font-size: 20px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
  }
  .result.err {
    background: #fdf2f2;
    border-color: #e8c4c4;
    border-left-color: #b32020;
    color: #b32020;
    font-size: 15px;
  }
  .status {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .prov {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .prov code {
    background: #eef2f6;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11.5px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d9a441; margin-right: 6px; }
  .dot.ok { background: #1a7f37; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Calculator</h1>
  <div class="sub">The arithmetic below runs the actual Python wheel built by this repo's CI/CD pipeline.</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="a">a</label>
        <input id="a" type="number" value="10" step="any">
      </div>
      <div class="field">
        <label for="b">b</label>
        <input id="b" type="number" value="4" step="any">
      </div>
    </div>

    <div class="field">
      <label for="op">Operation</label>
      <select id="op">
        <option value="add">add(a, b) = a + b</option>
        <option value="subtract">subtract(a, b) = a − b</option>
        <option value="divide">divide(a, b) = a ÷ b</option>
        <option value="power">power(a, b) = a ^ b</option>
      </select>
    </div>

    <button id="go" disabled>Loading Python…</button>

    <div id="result" class="result" style="display:none"></div>
    <div id="status" class="status"><span class="dot"></span>Downloading Pyodide…</div>

    <div class="prov" id="prov" style="display:none"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let calc = null;

function setStatus(text, ok) {
  $("status").innerHTML = '<span class="dot' + (ok ? " ok" : "") + '"></span>' + text;
}

function show(text, isError) {
  const el = $("result");
  el.style.display = "block";
  el.className = "result" + (isError ? " err" : "");
  el.textContent = text;
}

async function boot() {
  try {
    const pyodide = await loadPyodide();
    setStatus("Installing the wheel…");

    // The deploy job writes the wheel's exact filename here.
    const wheelName = (await (await fetch("wheel.txt")).text()).trim();

    await pyodide.loadPackage("micropip");
    const micropip = pyodide.pyimport("micropip");
    await micropip.install("./" + wheelName);

    calc = pyodide.pyimport("calculator.core");

    const pyVersion = pyodide.runPython("import sys; sys.version.split()[0]");
    $("prov").style.display = "block";
    $("prov").innerHTML =
      "Running <code>" + wheelName + "</code> on Python " + pyVersion +
      " (Pyodide/WebAssembly). This wheel was built and tested by GitHub Actions.";

    $("go").disabled = false;
    $("go").textContent = "Calculate";
    setStatus("Ready.", true);
  } catch (err) {
    setStatus("Failed to load: " + err.message);
    show(String(err), true);
  }
}

function calculate() {
  const a = parseFloat($("a").value);
  const b = parseFloat($("b").value);
  const op = $("op").value;

  if (Number.isNaN(a) || Number.isNaN(b)) {
    show("Please enter numbers for both a and b.", true);
    return;
  }

  try {
    const value = calc[op](a, b);
    show(op + "(" + a + ", " + b + ") = " + value);
  } catch (err) {
    // A Python exception raised inside the wheel surfaces here.
    show("Python raised: " + err.message.trim().split("\n").pop(), true);
  }
}

$("go").addEventListener("click", calculate);
boot();
</script>
</body>
</html>
